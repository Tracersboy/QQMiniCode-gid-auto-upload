# 由 huojiujian 开源免费使用，二改请备注来源；地址 https://github.com/huojiujian2
# 编译 APK 并发布 Release：
#  - push 到 master/main 或手动触发：编译 debug + release APK，上传 Artifacts
#  - 打 v* tag：额外创建 GitHub Release 并附带 APK
name: Android CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 预装 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 已就绪），
      # 无需 android-actions/setup-android，直接用预装的 sdkmanager 补齐缺失组件。
      # 整个步骤输出 tee 到 sdk-install.log，失败时由下一步回传到 ci-debug 分支。
      - name: Install Android SDK components
        run: |
          set -o pipefail
          {
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --list_installed || true
          "$SDKMANAGER" --list | grep -E "platforms;android-3|build-tools;3|ndk;" | head -40 || true
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # runner 预装包名带小版本号：platforms;android-37.0（不是 android-37）。
          # build-tools 36.0.0/37.0.0 与 NDK 27.3+ 均已预装，项目未锁定 ndkVersion，
          # AGP 会自动选用预装 NDK 做 release strip，无需再下载 r26d。
          "$SDKMANAGER" "platforms;android-37.0"
          } 2>&1 | tee sdk-install.log

      - name: Push SDK install log on failure
        if: failure()
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git checkout --orphan ci-debug || git checkout ci-debug
          git rm -rf . >/dev/null 2>&1 || true
          cp sdk-install.log SDK-INSTALL-FAILURE.md || echo "no log captured" > SDK-INSTALL-FAILURE.md
          git add SDK-INSTALL-FAILURE.md
          git commit -m "ci debug: sdk install failure run $GITHUB_RUN_ID ($GITHUB_SHA)" || true
          git push -f origin ci-debug

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs (debug + release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
